#
# cigo on each of cig's engines: cases of bench.toml, each run on the tree-walker and on
# the bytecode VM, a pair at a time. See docs/benchmarks.md.
#
# cigo's launcher chooses the engine (#142): it asks cig for the VM where a module of cigo
# is kept in cig's tin, which `cigo __lower` sees to, and for the tree-walker where
# `engine` is `tree`. So the VM cases here are cigo as it runs once it is installed, and
# the tree-walker cases set CIGO_ENGINE=tree, the way out. The module is kept in the
# home, so this manifest keeps one home for the whole run (`home = "shared"`) where
# bench.toml gives every sample a fresh one, and cigo is lowered into it first. Point the
# homes at a scratch folder, never at your own:
#
#   d=$(mktemp -d) && export HOME=$d CIGSCRIPT_HOME=$d/cig CIGO_HOME=$d/cigo
#   bin/cigo __lower && cig bench bench/engines.toml
#
# With a cig from before 1.25.0 the launcher asks for nothing and both sides are the
# tree-walker. The two "hook as installed" pairs pass `--no-check`, as the hook an
# agent's settings carry does.

format = 1

[bench]
product = "cigo"
version = ["cigo", "--version"]
home    = "shared"
binary  = "bin/cigo"

[defaults]
samples = 21
per     = 5
warmup  = 2
env     = { NO_COLOR = "1", CIG_DOCTOR = "0", CIG_SEAL_KEY = "file", CI = "", CIGO_REHEARSE = "never", CIGO_OSV = "off", CIGO_OSV_API = "file:///nonexistent/osv-api", CIGO_OSV_DUMPS = "file:///nonexistent/osv-dumps", CIGO_BLACKLIST_DIR = "/nonexistent/cigo-bench/blacklist.d", CIG_INTERNAL_TRACKER_DIR = "/nonexistent/cigo-bench/tracker" }

[[case]]
name   = "version: tree-walker"
group  = "tree"
run    = ["cigo", "--version"]
env    = { CIGO_ENGINE = "tree" }
expect = { exit = 0 }

[[case]]
name   = "version: vm"
group  = "vm"
run    = ["cigo", "--version"]
expect = { exit = 0 }

[[case]]
name   = "help: tree-walker"
group  = "tree"
run    = ["cigo", "--help"]
env    = { CIGO_ENGINE = "tree" }
expect = { exit = 0 }

[[case]]
name   = "help: vm"
group  = "vm"
run    = ["cigo", "--help"]
expect = { exit = 0 }

[[case]]
name   = "list, 52 tasks: tree-walker"
group  = "tree"
run    = ["cigo", "list"]
env    = { CIGO_ENGINE = "tree" }
expect = { exit = 0, stdout = "fixtures/list.expect" }

[[case]]
name   = "list, 52 tasks: vm"
group  = "vm"
run    = ["cigo", "list"]
expect = { exit = 0, stdout = "fixtures/list.expect" }

[[case]]
name   = "audit, one task: tree-walker"
group  = "tree"
run    = ["cigo", "audit", "task-01"]
env    = { CIGO_ENGINE = "tree" }
expect = { exit = 0, stdout = "fixtures/audit-1.expect" }

[[case]]
name   = "audit, one task: vm"
group  = "vm"
run    = ["cigo", "audit", "task-01"]
expect = { exit = 0, stdout = "fixtures/audit-1.expect" }

[[case]]
name   = "hook, benign command: tree-walker"
group  = "tree"
run    = ["cigo", "agent", "hook", "claude-code"]
stdin  = "fixtures/hook-benign.json"
env    = { CIGO_ENGINE = "tree" }
expect = { exit = 0 }

[[case]]
name   = "hook, benign command: vm"
group  = "vm"
run    = ["cigo", "agent", "hook", "claude-code"]
stdin  = "fixtures/hook-benign.json"
expect = { exit = 0 }

[[case]]
name   = "hook, curl piped to sh: tree-walker"
group  = "tree"
run    = ["cigo", "agent", "hook", "claude-code"]
stdin  = "fixtures/hook-curl-sh.json"
env    = { CIGO_ENGINE = "tree" }
expect = { exit = 0 }

[[case]]
name   = "hook, curl piped to sh: vm"
group  = "vm"
run    = ["cigo", "agent", "hook", "claude-code"]
stdin  = "fixtures/hook-curl-sh.json"
expect = { exit = 0 }

[[case]]
name   = "hook as installed, benign command: tree-walker"
group  = "tree"
run    = ["cigo", "--no-check", "agent", "hook", "claude-code"]
stdin  = "fixtures/hook-benign.json"
env    = { CIGO_ENGINE = "tree" }
expect = { exit = 0 }

[[case]]
name   = "hook as installed, benign command: vm"
group  = "vm"
run    = ["cigo", "--no-check", "agent", "hook", "claude-code"]
stdin  = "fixtures/hook-benign.json"
expect = { exit = 0 }

[[case]]
name   = "hook as installed, curl piped to sh: tree-walker"
group  = "tree"
run    = ["cigo", "--no-check", "agent", "hook", "claude-code"]
stdin  = "fixtures/hook-curl-sh.json"
env    = { CIGO_ENGINE = "tree" }
expect = { exit = 0 }

[[case]]
name   = "hook as installed, curl piped to sh: vm"
group  = "vm"
run    = ["cigo", "--no-check", "agent", "hook", "claude-code"]
stdin  = "fixtures/hook-curl-sh.json"
expect = { exit = 0 }

[[case]]
name   = "guard line check, benign: tree-walker"
group  = "tree"
run    = ["cigo", "guard", "check-line"]
stdin  = "fixtures/guard-benign.in"
env    = { CIGO_ENGINE = "tree" }
expect = { exit = 0 }

[[case]]
name   = "guard line check, benign: vm"
group  = "vm"
run    = ["cigo", "guard", "check-line"]
stdin  = "fixtures/guard-benign.in"
expect = { exit = 0 }
