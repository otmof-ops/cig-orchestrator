# REUSE specification (https://reuse.software). One license per path.
version = 1
SPDX-PackageName = "cig-orchestrator"
SPDX-PackageSupplier = "Jay Taylor"
SPDX-PackageDownloadLocation = "https://github.com/otmof-ops/cig-orchestrator"

[[annotations]]
path = ["orchestrate.cig", "bin/**", "install.sh", "tests/**", "cig-tasks.json", "REUSE.toml", ".gitignore", ".github/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jay Taylor (https://github.com/otmof-ops/cig-orchestrator)"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["docs/**", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "SUPPORT.md", "TOOLCHAINS.md", "FINDINGS.md", "NOTICE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jay Taylor (https://github.com/otmof-ops/cig-orchestrator)"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["examples/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jay Taylor (https://github.com/otmof-ops/cig-orchestrator)"
SPDX-License-Identifier = "CC0-1.0"
