# Labels a pull request by the files it changes (actions/labeler).
engine:
  - changed-files:
      - any-glob-to-any-file: ["orchestrate.cig"]
toolchain:
  - changed-files:
      - any-glob-to-any-file: ["TOOLCHAINS.md"]
tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/**"]
examples:
  - changed-files:
      - any-glob-to-any-file: ["examples/**"]
launcher:
  - changed-files:
      - any-glob-to-any-file: ["bin/**", "install.sh"]
documentation:
  - changed-files:
      - any-glob-to-any-file: ["*.md", "docs/**"]
ci:
  - changed-files:
      - any-glob-to-any-file: [".github/**", "cig-tasks.json"]
