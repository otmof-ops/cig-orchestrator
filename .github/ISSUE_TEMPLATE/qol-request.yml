name: Something your other tool does better
description: A quality-of-life feature from another language or tool that cigo or CigScript is missing.
title: "qol: "
labels: ["qol", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        If another language or tool saves you time in a way this doesn't, I want to know.
        These requests are read and answered, and the good ones land.
  - type: input
    id: source
    attributes:
      label: The language or tool that does it
      placeholder: "just, Cargo, Poetry, Task, GitHub Actions..."
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What it does
      description: How you use it, with a command or a snippet if you have one.
    validations:
      required: true
  - type: textarea
    id: saves
    attributes:
      label: What it saves you
      description: Time, a step, a mistake you no longer make.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it would belong
      options:
        - cigo, the orchestrator
        - CigScript, the language
        - Not sure
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: How you'd want it to look here
      description: A command, a manifest key, a message. Rough is fine.
