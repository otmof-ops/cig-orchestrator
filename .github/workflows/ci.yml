name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its earlier run. A push to main finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A docs-only change (docs/** and *.md where the job does not build or test docs) skips the heavy
  # jobs: the macOS and Windows test matrix, the native cigo path, the setup-action smoke test, the
  # alpine container and the Windows installer path. The Linux `ci` matrix entry still runs
  # (cigo's suite covers README examples). One `ci-ok` verdict always reports. Plain `git`, no
  # third-party action.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
      ci_oses: ${{ steps.filter.outputs.ci_oses }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: are any non-docs paths touched
        env:
          GH_EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          case "$GH_EVENT" in
            pull_request)
              base="$BASE_SHA"
              git fetch --no-tags --prune --depth=50 origin "+refs/heads/*:refs/remotes/origin/*" >/dev/null 2>&1 || true
              files=$(git diff --name-only "$base"...HEAD)
              ;;
            *)
              if git rev-parse HEAD^ >/dev/null 2>&1; then
                files=$(git diff --name-only HEAD^ HEAD)
              else
                files=$(git ls-tree -r --name-only HEAD)
              fi
              ;;
          esac
          echo "changed files:"
          printf '%s\n' "$files"
          code_changed=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|*.md) ;;
              *) code_changed=true; break ;;
            esac
          done <<EOF
          $files
          EOF
          if [ "$code_changed" = true ]; then
            ci_oses='[{"os":"ubuntu-latest","asset":"linux-x86_64","ext":""},{"os":"ubuntu-24.04-arm","asset":"linux-aarch64","ext":""},{"os":"macos-latest","asset":"macos-aarch64","ext":""},{"os":"macos-15-intel","asset":"macos-x86_64","ext":""},{"os":"windows-latest","asset":"windows-x86_64","ext":".exe"}]'
          else
            ci_oses='[{"os":"ubuntu-latest","asset":"linux-x86_64","ext":""}]'
          fi
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"
          echo "ci_oses=$ci_oses" >> "$GITHUB_OUTPUT"
          echo "code_changed=$code_changed"
          echo "ci_oses=$ci_oses"

  ci:
    name: ci (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.ci_oses) }}
    env:
      CIG_VERSION: v1.21.0
      CIGO_TEST_TIMINGS: test-timings.json
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Ubuntu's AppArmor restricts unprivileged user namespaces since 23.10;
      # cig's box (the default for tasks on Linux) needs them.
      - name: Let cig make its box
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install cig
        run: |
          mkdir -p "$HOME/.local/bin" && cd "$RUNNER_TEMP"
          base="https://github.com/otmof-ops/cig-script/releases/download/$CIG_VERSION"
          name="cig-$CIG_VERSION-${{ matrix.asset }}${{ matrix.ext }}"
          curl -fsSLO "$base/$name"
          curl -fsSLO "$base/$name.sha256"
          if command -v sha256sum >/dev/null; then sha256sum -c "$name.sha256"; else shasum -a 256 -c "$name.sha256"; fi
          install -m 755 "$name" "$HOME/.local/bin/cig${{ matrix.ext }}"
          if command -v cygpath >/dev/null; then cygpath -w "$HOME/.local/bin" >> "$GITHUB_PATH"; else echo "$HOME/.local/bin" >> "$GITHUB_PATH"; fi

      # The images differ in what they carry; the suite needs shellcheck.
      - name: Install shellcheck where the image lacks it
        run: |
          command -v shellcheck && exit 0
          case "${{ runner.os }}" in
            Windows) choco install shellcheck -y --no-progress ;;
            macOS) brew install shellcheck ;;
            *) sudo apt-get install -y shellcheck ;;
          esac

      - name: Versions
        run: |
          cig --version
          shellcheck --version | head -2
          python3 --version || python --version || true
          node --version || true

      - name: The repository's own checks (cig check, shellcheck, the suite)
        run: bin/cigo --no-rollback run ci

      - name: TOOLCHAINS.md matches the knowledge base
        if: runner.os == 'Linux'
        run: bin/cigo run toolchains-doc && git diff --exit-code TOOLCHAINS.md

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cigo-logs-${{ matrix.os }}
          path: .cig-orchestrator/
          include-hidden-files: true

      # Each test's wall time and the slowest and the per-group totals (cigo#119):
      # where macOS and Windows lose their time.
      - name: Keep the test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-${{ matrix.os }}
          path: test-timings.json
          if-no-files-found: warn

  # cigcompile#8: the same suite against cigo compiled to a native program
  # by cigcompile's own release, onto cig's release of the version it pins.
  # CIGO_TEST_BINARY makes the suite run it wherever it would run
  # `cig run orchestrate.cig --`.
  native:
    name: native cigo (cigcompile#8)
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    env:
      CIG_RUNTIME_VERSION: v1.21.0
      CIGCOMPILE_VERSION: v0.4.0
      CIGO_TEST_TIMINGS: test-timings.json
    steps:
      - uses: actions/checkout@v7
      - name: Let cig make its box
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install cig, the runtime
        run: |
          base="https://github.com/otmof-ops/cig-script/releases/download/$CIG_RUNTIME_VERSION"
          curl -fsSLO "$base/cig-$CIG_RUNTIME_VERSION-linux-x86_64"
          curl -fsSLO "$base/cig-$CIG_RUNTIME_VERSION-linux-x86_64.sha256"
          sha256sum -c "cig-$CIG_RUNTIME_VERSION-linux-x86_64.sha256"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "cig-$CIG_RUNTIME_VERSION-linux-x86_64" "$HOME/.local/bin/cig"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install cigcompile
        run: |
          base="https://github.com/otmof-ops/cig-compile/releases/download/$CIGCOMPILE_VERSION"
          curl -fsSLO "$base/cigcompile-$CIGCOMPILE_VERSION-linux-x86_64"
          curl -fsSLO "$base/cigcompile-$CIGCOMPILE_VERSION-linux-x86_64.sha256"
          sha256sum -c "cigcompile-$CIGCOMPILE_VERSION-linux-x86_64.sha256"
          install -m 755 "cigcompile-$CIGCOMPILE_VERSION-linux-x86_64" "$HOME/.local/bin/cigcompile"
      - name: Compile cigo
        run: cigcompile build orchestrate.cig -o "$RUNNER_TEMP/cigo-native" --runtime "$HOME/.local/bin/cig"
      - name: The suite, against the native cigo
        run: CIGO_TEST_BINARY="$RUNNER_TEMP/cigo-native" cig run tests/run.cig
      - name: Keep the test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-native
          path: test-timings.json
          if-no-files-found: warn

  # The setup action as a workflow uses it (#56): cig and cigo on PATH in one step.
  setup-action:
    name: the setup action (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./setup
      - name: cig and cigo answer
        shell: bash
        run: |
          cig --version
          cigo --version

  # musl and BusyBox, with bash installed: what Alpine users have.
  ci-alpine:
    name: ci (alpine)
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    container: alpine:latest
    env:
      CIG_VERSION: v1.21.0
      CIGO_TEST_TIMINGS: test-timings.json
    steps:
      # git first: without it, checkout downloads a tarball and leaves no .git,
      # and the shell component's `git ls-files` has nothing to list.
      - run: apk add --no-cache bash curl git python3 nodejs shellcheck coreutils
      - uses: actions/checkout@v7
      # The workspace is mounted in from the host, owned by another uid.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install cig
        run: |
          mkdir -p /usr/local/bin && cd /tmp
          base="https://github.com/otmof-ops/cig-script/releases/download/$CIG_VERSION"
          curl -fsSLO "$base/cig-$CIG_VERSION-linux-x86_64"
          curl -fsSLO "$base/cig-$CIG_VERSION-linux-x86_64.sha256"
          sha256sum -c "cig-$CIG_VERSION-linux-x86_64.sha256"
          install -m 755 "cig-$CIG_VERSION-linux-x86_64" /usr/local/bin/cig
      - run: bin/cigo --no-rollback run ci
      - name: Keep the test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-alpine
          path: test-timings.json
          if-no-files-found: warn

  # The cmd shim and the PowerShell launcher, on a Windows runner: cig from its
  # release (checked against its .sha256), cigo from this checkout's bin (cigo is
  # installed by ciginstaller now; this job tests the launcher it lays down, from
  # PATH as a user would have it), and the installer stubs.
  ci-windows-installers:
    name: installers (windows)
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: windows-latest
    env:
      CIG_VERSION: v1.21.0
      CIGO_TEST_TIMINGS: test-timings.json
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Install cig, and put this checkout's cigo on PATH
        run: |
          $dir = "$env:RUNNER_TEMP\cig"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $name = "cig-$env:CIG_VERSION-windows-x86_64.exe"
          $base = "https://github.com/otmof-ops/cig-script/releases/download/$env:CIG_VERSION"
          Invoke-WebRequest "$base/$name" -OutFile "$dir\$name"
          Invoke-WebRequest "$base/$name.sha256" -OutFile "$dir\$name.sha256"
          $want = ((Get-Content "$dir\$name.sha256" -Raw).Trim() -split '\s+')[0].ToLower()
          $got = (Get-FileHash "$dir\$name" -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "cig $env:CIG_VERSION sha256 mismatch: $got, wanted $want" }
          Move-Item "$dir\$name" "$dir\cig.exe"
          $env:Path = "$dir;$env:Path"
          echo "$dir;$PWD\bin" >> $env:GITHUB_PATH
          cig --version
      - run: choco install shellcheck -y --no-progress
      # The suite's fixtures run sort and printf as a Git Bash user has
      # them, first on PATH; Windows' own sort.exe is another program.
      - run: echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
      - run: cigo version --json
      - run: cigo __doctor --json
      - run: cigo check
      - run: cigo --no-rollback run ci
      - name: Keep the test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-windows-installers
          path: test-timings.json
          if-no-files-found: warn
      # `cigo` at a PowerShell prompt is the cmd shim (the launcher is
      # cigo.launch.ps1, a name PowerShell does not pick), so the task's
      # own `--` arrives whole. The same from cmd.exe and from Windows
      # PowerShell 5.1, which a hosted runner never reaches on its own.
      - name: the task keeps its `--` arguments through the shim
        run: |
          $p = Join-Path $env:RUNNER_TEMP 'dashdash'
          New-Item -ItemType Directory -Force -Path $p | Out-Null
          Set-Content -LiteralPath (Join-Path $p 'cig-tasks.json') -Value '{"tasks": {"say": {"cmd": ["cmd", "/c", "echo", "got"]}}}'
          Set-Location -LiteralPath $p
          $out = cigo run say -- --tag v2 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'got --tag v2') { throw 'the task did not get -- --tag v2' }
      - name: the shim from cmd.exe
        shell: cmd
        run: |
          cigo version --json
          cigo --dry-run run ci
          cd /d "%RUNNER_TEMP%\dashdash"
          cigo run say -- --tag v2 | findstr /C:"got --tag v2"
      - name: Windows PowerShell 5.1
        shell: powershell
        run: |
          cigo version
          Set-Location -LiteralPath (Join-Path $env:RUNNER_TEMP 'dashdash')
          # stdout alone: under 5.1 a redirected stderr line ("burned 4 ops")
          # becomes an error record, and the step's Stop preference throws it.
          $out = cigo run say -- --tag v2 | Out-String
          if ($out -notmatch 'got --tag v2') { throw "5.1: the task did not get -- --tag v2: $out" }
      # update, uninstall and doctor are ciginstaller's now: without it on
      # PATH each says so and exits 127; install.ps1 only redirects.
      - name: the stubs without ciginstaller
        run: |
          if (Get-Command ciginstaller -ErrorAction SilentlyContinue) { throw 'ciginstaller is on this runner; the missing-installer check needs it absent' }
          foreach ($c in @('uninstall', 'doctor')) {
            $out = cigo $c 2>&1 | Out-String
            if ($LASTEXITCODE -ne 127) { throw "cigo $c exited $LASTEXITCODE, wanted 127" }
            if ($out -notmatch "is ciginstaller's job now") { throw "cigo ${c}: $out" }
          }
          # From a checkout, update is refused before it looks for the installer.
          $out = cigo update 2>&1 | Out-String
          if ($LASTEXITCODE -ne 2 -or $out -notmatch 'runs from a checkout' -or $out -notmatch 'git pull') { throw "cigo update in a checkout: $LASTEXITCODE $out" }
          # a child process, so its stderr ([Console]::Error) is captured by 2>&1
          $out = pwsh -NoProfile -File .\install.ps1 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $out -notmatch 'ciginstaller install stick cigo') { throw "install.ps1: $LASTEXITCODE $out" }
          # the runner ends a pwsh step with exit $LASTEXITCODE, which is install.ps1's
          # deliberate 1; every check above passed
          exit 0

  # The one verdict every pull request reports: did every needed job pass or skip.
  ci-ok:
    name: ci
    if: always()
    needs: [changes, ci, native, setup-action, ci-alpine, ci-windows-installers]
    runs-on: ubuntu-latest
    steps:
      - name: every needed job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS"
          failed=$(printf '%s' "$NEEDS" | jq -r 'to_entries | map(select(.value.result != "success" and .value.result != "skipped")) | map(.key) | join(" ")')
          if [ -n "$failed" ]; then
            echo "::error::failed or cancelled: $failed"
            exit 1
          fi
          echo "every needed job passed or was skipped"
