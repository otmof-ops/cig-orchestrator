name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    asset: linux-x86_64,   ext: "" }
          - { os: ubuntu-24.04-arm, asset: linux-aarch64,  ext: "" }
          - { os: macos-latest,     asset: macos-aarch64,  ext: "" }
          - { os: macos-15-intel,   asset: macos-x86_64,   ext: "" }
          - { os: windows-latest,   asset: windows-x86_64, ext: ".exe" }
    env:
      CIG_VERSION: v1.20.0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Ubuntu's AppArmor restricts unprivileged user namespaces since 23.10;
      # cig's box (the default for tasks on Linux) needs them.
      - name: Let cig make its box
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install cig
        run: |
          mkdir -p "$HOME/.local/bin" && cd "$RUNNER_TEMP"
          base="https://github.com/otmof-ops/cig-script/releases/download/$CIG_VERSION"
          name="cig-$CIG_VERSION-${{ matrix.asset }}${{ matrix.ext }}"
          curl -fsSLO "$base/$name"
          curl -fsSLO "$base/$name.sha256"
          if command -v sha256sum >/dev/null; then sha256sum -c "$name.sha256"; else shasum -a 256 -c "$name.sha256"; fi
          install -m 755 "$name" "$HOME/.local/bin/cig${{ matrix.ext }}"
          if command -v cygpath >/dev/null; then cygpath -w "$HOME/.local/bin" >> "$GITHUB_PATH"; else echo "$HOME/.local/bin" >> "$GITHUB_PATH"; fi

      # The images differ in what they carry; the suite needs shellcheck.
      - name: Install shellcheck where the image lacks it
        run: |
          command -v shellcheck && exit 0
          case "${{ runner.os }}" in
            Windows) choco install shellcheck -y --no-progress ;;
            macOS) brew install shellcheck ;;
            *) sudo apt-get install -y shellcheck ;;
          esac

      - name: Versions
        run: |
          cig --version
          shellcheck --version | head -2
          python3 --version || python --version || true
          node --version || true

      - name: The repository's own checks (cig check, shellcheck, the suite)
        run: bin/cigo --no-rollback run ci

      - name: TOOLCHAINS.md matches the knowledge base
        if: runner.os == 'Linux'
        run: bin/cigo run toolchains-doc && git diff --exit-code TOOLCHAINS.md

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cigo-logs-${{ matrix.os }}
          path: .cig-orchestrator/
          include-hidden-files: true

  # cigcompile#8: the same suite against cigo compiled to a native program
  # by cigcompile's own release, onto cig's release of the version it pins.
  # CIGO_TEST_BINARY makes the suite run it wherever it would run
  # `cig run orchestrate.cig --`.
  native:
    name: native cigo (cigcompile#8)
    runs-on: ubuntu-latest
    env:
      CIG_RUNTIME_VERSION: v1.20.0
      CIGCOMPILE_VERSION: v0.3.0
    steps:
      - uses: actions/checkout@v7
      - name: Let cig make its box
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install cig, the runtime
        run: |
          base="https://github.com/otmof-ops/cig-script/releases/download/$CIG_RUNTIME_VERSION"
          curl -fsSLO "$base/cig-$CIG_RUNTIME_VERSION-linux-x86_64"
          curl -fsSLO "$base/cig-$CIG_RUNTIME_VERSION-linux-x86_64.sha256"
          sha256sum -c "cig-$CIG_RUNTIME_VERSION-linux-x86_64.sha256"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "cig-$CIG_RUNTIME_VERSION-linux-x86_64" "$HOME/.local/bin/cig"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install cigcompile
        run: |
          base="https://github.com/otmof-ops/cig-compile/releases/download/$CIGCOMPILE_VERSION"
          curl -fsSLO "$base/cigcompile-$CIGCOMPILE_VERSION-linux-x86_64"
          curl -fsSLO "$base/cigcompile-$CIGCOMPILE_VERSION-linux-x86_64.sha256"
          sha256sum -c "cigcompile-$CIGCOMPILE_VERSION-linux-x86_64.sha256"
          install -m 755 "cigcompile-$CIGCOMPILE_VERSION-linux-x86_64" "$HOME/.local/bin/cigcompile"
      - name: Compile cigo
        run: cigcompile build orchestrate.cig -o "$RUNNER_TEMP/cigo-native" --runtime "$HOME/.local/bin/cig"
      - name: The suite, against the native cigo
        run: CIGO_TEST_BINARY="$RUNNER_TEMP/cigo-native" cig run tests/run.cig

  # musl and BusyBox, with bash installed: what Alpine users have.
  ci-alpine:
    name: ci (alpine)
    runs-on: ubuntu-latest
    container: alpine:latest
    env:
      CIG_VERSION: v1.20.0
    steps:
      # git first: without it, checkout downloads a tarball and leaves no .git,
      # and the shell component's `git ls-files` has nothing to list.
      - run: apk add --no-cache bash curl git python3 nodejs shellcheck coreutils
      - uses: actions/checkout@v7
      # The workspace is mounted in from the host, owned by another uid.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install cig
        run: |
          mkdir -p /usr/local/bin && cd /tmp
          base="https://github.com/otmof-ops/cig-script/releases/download/$CIG_VERSION"
          curl -fsSLO "$base/cig-$CIG_VERSION-linux-x86_64"
          curl -fsSLO "$base/cig-$CIG_VERSION-linux-x86_64.sha256"
          sha256sum -c "cig-$CIG_VERSION-linux-x86_64.sha256"
          install -m 755 "cig-$CIG_VERSION-linux-x86_64" /usr/local/bin/cig
      - run: bin/cigo --no-rollback run ci

  # The cmd shim and the PowerShell launcher, on a Windows runner: cig from
  # CigScript's installer, cigo from this checkout's bin (cigo is installed by
  # ciginstaller now; this job tests the launcher it lays down, from PATH as a
  # user would have it), and the installer stubs.
  ci-windows-installers:
    name: installers (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Install cig, and put this checkout's cigo on PATH
        env:
          CIG_NO_MODIFY_PATH: '1'
        run: |
          irm https://raw.githubusercontent.com/otmof-ops/cig-script/main/install.ps1 | iex
          $env:Path = "$env:LOCALAPPDATA\Programs\cig;$env:Path"
          echo "$env:LOCALAPPDATA\Programs\cig;$PWD\bin" >> $env:GITHUB_PATH
      - run: choco install shellcheck -y --no-progress
      # The suite's fixtures run sort and printf as a Git Bash user has
      # them, first on PATH; Windows' own sort.exe is another program.
      - run: echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
      - run: cigo version --json
      - run: cigo __doctor --json
      - run: cigo check
      - run: cigo --no-rollback run ci
      # `cigo` at a PowerShell prompt is the cmd shim (the launcher is
      # cigo.launch.ps1, a name PowerShell does not pick), so the task's
      # own `--` arrives whole. The same from cmd.exe and from Windows
      # PowerShell 5.1, which a hosted runner never reaches on its own.
      - name: the task keeps its `--` arguments through the shim
        run: |
          $p = Join-Path $env:RUNNER_TEMP 'dashdash'
          New-Item -ItemType Directory -Force -Path $p | Out-Null
          Set-Content -LiteralPath (Join-Path $p 'cig-tasks.json') -Value '{"tasks": {"say": {"cmd": ["cmd", "/c", "echo", "got"]}}}'
          Set-Location -LiteralPath $p
          $out = cigo run say -- --tag v2 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'got --tag v2') { throw 'the task did not get -- --tag v2' }
      - name: the shim from cmd.exe
        shell: cmd
        run: |
          cigo version --json
          cigo --dry-run run ci
          cd /d "%RUNNER_TEMP%\dashdash"
          cigo run say -- --tag v2 | findstr /C:"got --tag v2"
      - name: Windows PowerShell 5.1
        shell: powershell
        run: |
          cigo version
          Set-Location -LiteralPath (Join-Path $env:RUNNER_TEMP 'dashdash')
          # stdout alone: under 5.1 a redirected stderr line ("burned 4 ops")
          # becomes an error record, and the step's Stop preference throws it.
          $out = cigo run say -- --tag v2 | Out-String
          if ($out -notmatch 'got --tag v2') { throw "5.1: the task did not get -- --tag v2: $out" }
      # update, uninstall and doctor are ciginstaller's now: without it on
      # PATH each says so and exits 127; install.ps1 only redirects.
      - name: the stubs without ciginstaller
        run: |
          if (Get-Command ciginstaller -ErrorAction SilentlyContinue) { throw 'ciginstaller is on this runner; the missing-installer check needs it absent' }
          foreach ($c in @('update', 'uninstall', 'doctor')) {
            $out = cigo $c 2>&1 | Out-String
            if ($LASTEXITCODE -ne 127) { throw "cigo $c exited $LASTEXITCODE, wanted 127" }
            if ($out -notmatch "is ciginstaller's job now") { throw "cigo ${c}: $out" }
          }
          $out = .\install.ps1 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $out -notmatch 'ciginstaller install stick cigo') { throw "install.ps1: $LASTEXITCODE $out" }

  # A tag vX.Y.Z is a release: one tarball, its checksum, a build attestation,
  # and the licence beside them. The installer's manifest reads these.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, ci-alpine, ci-windows-installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: the tarball and its checksum (the assets the installer's manifest reads)
        run: |
          tag="$GITHUB_REF_NAME"
          grep -q "^stick VERSION = \"${tag#v}\"" orchestrate.cig || { echo "orchestrate.cig says another version than $tag" >&2; exit 1; }
          dir="cig-orchestrator-$tag"
          mkdir -p "$dir/bin"
          cp orchestrate.cig install.sh install.ps1 LICENSE NOTICE README.md CHANGELOG.md TOOLCHAINS.md YANKED "$dir/"
          cp bin/cigo bin/cigo.launch.ps1 bin/cigo.cmd "$dir/bin/"
          cp -r LICENSES docs "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
          cat "$dir.tar.gz.sha256"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: cig-orchestrator-${{ github.ref_name }}.tar.gz
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            cig-orchestrator-${{ github.ref_name }}.tar.gz
            cig-orchestrator-${{ github.ref_name }}.tar.gz.sha256
            LICENSE
            NOTICE
