name: release

# A tag `vX.Y.Z` is a release: one tarball, its checksum, a build attestation, and the license
# beside them. The installer's manifest reads these.
#
# Row 7 of carton 0.2.0: the release reuses the tagged SHA's green ci.yml run instead of
# rebuilding and retesting. The first job (`ci-green`) reads the commit's own ci.yml run through
# the Actions API; nothing publishes if CI did not pass on this exact commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci-green:
    name: CI was green for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      actions: read
    steps:
      - name: find and check the CI run for the tag's SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The tag's commit must have a green ci.yml run. A run still in progress is waited for
          # (a tag pushed straight after a merge), up to 90 minutes. Nothing publishes otherwise.
          deadline=$(( $(date +%s) + 5400 ))
          while :; do
            runs="$(gh api --paginate \
              "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100" \
              --jq '.workflow_runs[] | [.id, .status, .conclusion, .event, .html_url] | @tsv')"
            printf 'ci.yml runs for %s:\n%s\n' "$SHA" "${runs:-none yet}"
            if printf '%s\n' "$runs" | awk -F '\t' '$2 == "completed" && $3 == "success" { print "green run:", $5; found = 1 } END { exit found ? 0 : 1 }'; then
              echo "ci.yml is green for $SHA"
              exit 0
            fi
            if [ -n "$runs" ] && ! printf '%s\n' "$runs" | awk -F '\t' '$2 != "completed" { live = 1 } END { exit live ? 0 : 1 }'; then
              echo "::error::ci.yml finished on $SHA without a success: get it green on main, then tag that commit"
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::no green ci.yml run for $SHA after 90 minutes: let CI finish, then rerun this workflow"
              exit 1
            fi
            echo "waiting for ci.yml on $SHA"
            sleep 60
          done

  release:
    needs: ci-green
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: the tarball and its checksum (the assets the installer's manifest reads)
        run: |
          tag="$GITHUB_REF_NAME"
          grep -q "^stick VERSION = \"${tag#v}\"" orchestrate.cig || { echo "orchestrate.cig says another version than $tag" >&2; exit 1; }
          dir="cig-orchestrator-$tag"
          mkdir -p "$dir/bin"
          cp orchestrate.cig install.sh install.ps1 LICENSE NOTICE README.md CHANGELOG.md TOOLCHAINS.md YANKED "$dir/"
          cp bin/cigo bin/cigo.launch.ps1 bin/cigo.cmd "$dir/bin/"
          cp -r LICENSES docs "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
          cat "$dir.tar.gz.sha256"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: cig-orchestrator-${{ github.ref_name }}.tar.gz
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            cig-orchestrator-${{ github.ref_name }}.tar.gz
            cig-orchestrator-${{ github.ref_name }}.tar.gz.sha256
            LICENSE
            NOTICE
