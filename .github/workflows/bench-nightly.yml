# The nightly benchmark (cig-orchestrator#112, cig-script#179 step 6): cig-script's
# reusable bench.yml runs bench/bench.toml on a schedule and appends one line per run
# to `history/cigo.jsonl` on the `bench-history` branch, which `cig bench history`
# reads. A timing never fails it (timings are reported, never gated: cig-script#153);
# a case whose output is wrong does. Pull requests do not run it: the heavy suites
# run nightly, the fast ones on a pull request once a cig release has `cig bench`'s
# debugging flags (the pinned cig is 1.20.0, which does not).
name: bench-nightly

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    uses: otmof-ops/cig-script/.github/workflows/bench.yml@main
    with:
      cig-version: "1.20.0"
    permissions:
      contents: write
      pull-requests: write
